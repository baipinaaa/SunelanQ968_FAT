<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>网速 · 流量统计</title>
<style>
  :root {
    --bg: #0e1013;
    --card: #181b20;
    --card2: #1f232a;
    --text: #e8eaed;
    --muted: #8b919b;
    --down: #4f8cff;
    --up: #35c48b;
    --line: #262b33;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Noto Sans SC", Roboto, sans-serif; }
  body { padding: 14px 14px 28px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  h1 { font-size: 17px; font-weight: 600; margin: 0; }
  h1 small { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 6px; }
  button { background: var(--card2); color: var(--text); border: 1px solid var(--line);
    border-radius: 9px; padding: 7px 12px; font-size: 12px; }
  button:active { background: #2a303a; }
  .speed { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .speed .box { background: var(--card); border-radius: 13px; padding: 12px 14px; }
  .speed .label { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .speed .value { font-size: 20px; font-weight: 600; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .down .value { color: var(--down); }
  .up .value { color: var(--up); }
  .totals { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .totals .box { background: var(--card); border-radius: 13px; padding: 11px 14px; }
  .totals .label { font-size: 11px; color: var(--muted); }
  .totals .value { font-size: 15px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .section-title { display: flex; align-items: center; justify-content: space-between;
    margin: 0 2px 8px; font-size: 13px; color: var(--muted); }
  .tabs { display: flex; gap: 6px; }
  .tabs button { padding: 4px 10px; font-size: 11px; border-radius: 7px; }
  .tabs button.active { background: var(--down); border-color: var(--down); color: #fff; }
  .list { background: var(--card); border-radius: 13px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px;
    padding: 11px 14px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .row .name { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .nums { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
    display: flex; gap: 10px; justify-content: flex-end; white-space: nowrap; }
  .row .nums .d { color: var(--down); }
  .row .nums .u { color: var(--up); }
  .row .bar { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: #23272e; overflow: hidden; }
  .row .bar i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--down), var(--up)); }
  .empty, .hint { padding: 18px 14px; font-size: 12px; color: var(--muted); line-height: 1.7; }
  .hint code { background: #22262d; padding: 1px 5px; border-radius: 4px; font-size: 11px; }
  footer { margin-top: 14px; font-size: 11px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<header>
  <h1>流量统计<small id="today">今日</small></h1>
  <button id="refresh">刷新</button>
</header>

<div class="speed">
  <div class="box down">
    <div class="label">实时下载</div>
    <div class="value" id="speedRx">--</div>
  </div>
  <div class="box up">
    <div class="label">实时上传</div>
    <div class="value" id="speedTx">--</div>
  </div>
</div>

<div class="totals">
  <div class="box">
    <div class="label">今日下载</div>
    <div class="value" id="totalRx">--</div>
  </div>
  <div class="box">
    <div class="label">今日上传</div>
    <div class="value" id="totalTx">--</div>
  </div>
</div>

<div class="section-title">
  <span>按应用</span>
  <div class="tabs">
    <button data-sort="rx" class="active">下载</button>
    <button data-sort="tx">上传</button>
  </div>
</div>

<div class="list" id="list">
  <div class="empty">正在读取…</div>
</div>

<div class="hint" id="hint" hidden>
  读不到统计数据。请确认：<br />
  1. LSPosed 中已启用「状态栏网速·流量统计」，作用域勾选了 SystemUI；<br />
  2. 已重启 SystemUI，且状态栏能看到网速；<br />
  3. 数据文件 <code>/data/user/0/com.android.systemui/files/netspeed_stats.json</code> 每 30 秒更新一次。
</div>

<footer>数据来自 SystemUI（NetworkStatsManager），每 30 秒刷新</footer>

<script>
const STATS_FILE = "/data/user/0/com.android.systemui/files/netspeed_stats.json";
let sortKey = "rx";
let lastData = null;

function exec(cmd) {
  return new Promise((resolve) => {
    try {
      if (window.ksu && typeof window.ksu.exec === "function") {
        let done = false;
        const finish = (v) => { if (!done) { done = true; resolve(typeof v === "string" ? v : (v && v.stdout) || ""); } };
        const ret = window.ksu.exec(cmd, (errno, stdout) => finish(stdout || ""));
        if (ret && typeof ret.then === "function") {
          ret.then((r) => finish(r)).catch(() => finish(""));
        }
      } else {
        resolve("");
      }
    } catch (e) {
      resolve("");
    }
  });
}

function fmtBytes(n) {
  n = Number(n) || 0;
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
  if (n < 1024 * 1024 * 1024) return (n / 1048576).toFixed(1) + " MB";
  return (n / 1073741824).toFixed(2) + " GB";
}

function fmtSpeed(bps) {
  const kb = (Number(bps) || 0) / 1024;
  if (kb < 1000) return kb.toFixed(0) + " kB/s";
  return (kb / 1024).toFixed(1) + " MB/s";
}

function render(data) {
  lastData = data;
  document.getElementById("speedRx").textContent = fmtSpeed(data.speedRx);
  document.getElementById("speedTx").textContent = fmtSpeed(data.speedTx);
  document.getElementById("totalRx").textContent = fmtBytes(data.totalRx);
  document.getElementById("totalTx").textContent = fmtBytes(data.totalTx);

  const apps = Array.isArray(data.apps) ? data.apps.slice() : [];
  apps.sort((a, b) => (b[sortKey] || 0) - (a[sortKey] || 0));
  const list = document.getElementById("list");
  const max = apps.length ? Math.max(1, apps[0][sortKey] || 1) : 1;

  if (!apps.length) {
    list.innerHTML = '<div class="empty">今天还没有记录到应用的流量。</div>';
    return;
  }
  list.innerHTML = apps.slice(0, 60).map((app) => {
    const pct = Math.max(2, Math.round(((app[sortKey] || 0) * 100) / max));
    return '<div class="row">' +
      '<div class="name">' + escapeHtml(app.name || ("uid " + app.uid)) + '</div>' +
      '<div class="nums"><span class="d">↓' + fmtBytes(app.rx) + '</span>' +
      '<span class="u">↑' + fmtBytes(app.tx) + '</span></div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
      '</div>';
  }).join("");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function refresh() {
  const raw = await exec("cat " + STATS_FILE + " 2>/dev/null");
  const hint = document.getElementById("hint");
  if (!raw || !raw.trim()) {
    hint.hidden = false;
    return;
  }
  let data = null;
  try {
    data = JSON.parse(raw);
  } catch (e) {
    hint.hidden = false;
    return;
  }
  hint.hidden = true;
  const today = new Date(data.dayStart);
  document.getElementById("today").textContent =
    (today.getMonth() + 1) + "月" + today.getDate() + "日";
  render(data);
}

document.querySelectorAll(".tabs button").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tabs button").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    sortKey = btn.dataset.sort;
    if (lastData) render(lastData);
  });
});

document.getElementById("refresh").addEventListener("click", refresh);
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
