name: build-netspeed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Xposed APK
        working-directory: netspeed
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        working-directory: netspeed
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          echo "APK=$APK"
          cp "$APK" netspeed-apk.apk
          ls -l netspeed-apk.apk

      - uses: actions/upload-artifact@v4
        with:
          name: netspeed-apk
          path: netspeed/netspeed-apk.apk
          if-no-files-found: error
