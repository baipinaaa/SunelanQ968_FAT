name: build-fat

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  APKTOOL_URL: https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
  SIGNER_URL: https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare tools
        run: |
          mkdir -p "$HOME/.local/share/apktool/framework" dist
          cp keys/framework-1.apk "$HOME/.local/share/apktool/framework/1.apk"
          curl -sSL -o /tmp/apktool.jar "$APKTOOL_URL"
          curl -sSL -o /tmp/uber-apk-signer.jar "$SIGNER_URL"
          ls -l /tmp/apktool.jar /tmp/uber-apk-signer.jar "$HOME/.local/share/apktool/framework/1.apk"
          java -jar /tmp/apktool.jar --version

      - name: Build with apktool
        run: |
          java -jar /tmp/apktool.jar b -o dist/fat-unsigned.apk apktool
          ls -l dist/

      - name: Sign
        run: |
          java -jar /tmp/uber-apk-signer.jar \
            --apks dist/fat-unsigned.apk \
            --ks keys/dev.jks --ksAlias devkey \
            --ksPass dev123456 --ksKeyPass dev123456 \
            --ksDebug false -o dist
          ls -l dist/

      - name: Rename artifact
        run: |
          set -e
          src=$(ls dist/*signed*.apk | head -1)
          dst="dist/SunelanQ968_FAT-v1.0.${GITHUB_RUN_NUMBER}.apk"
          cp "$src" "$dst"
          ls -l "$dst"
          echo "APK_PATH=$dst" >> "$GITHUB_ENV"

      - name: Verify signature
        run: |
          unzip -l "$APK_PATH" | head -5
          sha256sum "$APK_PATH"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FAT v1.0.${{ github.run_number }}
          body: |
            package: `com.sunelanq968.fat`
            commit: ${{ github.sha }}
            build: #${{ github.run_number }} (${{ github.event_name }})

            apktool 3.0.3 重建 + uber-apk-signer 签名（alias `devkey`）。
          files: ${{ env.APK_PATH }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
